<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mind map</title>
<style>
:root{
  --bg:#f5f6fb; --panel:#ffffff; --panel2:#f0f2f9; --ink:#171a2b; --muted:#667089; --line:#dfe3ef;
  --shadow:0 10px 30px rgba(30,40,90,.12); --accent:#5b6cff; --gold:#f5a524; --ok:#22b07d; --warn:#f0a020;
  --node:#ffffff; --grid:rgba(90,100,160,.10);
  --font: "Segoe UI Variable","Segoe UI",Inter,system-ui,-apple-system,Roboto,sans-serif;
}
:root[data-theme=dark]{
  --bg:#0d1020; --panel:#161a30; --panel2:#1d2240; --ink:#e9ecfb; --muted:#97a0c2; --line:#2a3058;
  --shadow:0 14px 40px rgba(0,0,0,.45); --accent:#8a97ff; --node:#1a1f3a; --grid:rgba(140,150,230,.08);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);overflow:hidden;font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
.app{display:flex;flex-direction:column;height:100%}

/* header */
header{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);z-index:5;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:6px}
.brand b{font-size:16px;letter-spacing:.2px}
.brand span{font-size:11.5px;color:var(--muted);max-width:420px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;background:var(--panel2);border-radius:12px;padding:3px;gap:2px}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:9px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.search{position:relative;flex:1;min-width:180px;max-width:360px}
.search input{width:100%;padding:9px 34px 9px 34px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:inherit;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.55}
.search kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.spacer{flex:1}
.prog{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted)}
.prog b{display:block;color:var(--ink);font-size:13px}
.icon-btn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;width:36px;height:36px;display:grid;place-items:center}
.icon-btn:hover{border-color:var(--accent)}

/* filter bar */
.filters{display:flex;gap:8px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--panel2);padding:5px 12px;border-radius:999px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.filters .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.ctl-active{display:none;background:color-mix(in srgb,var(--gold) 20%,transparent);border:1px solid var(--gold);color:var(--ink)}
.ctl-active.show{display:inline-flex}

/* main */
main{flex:1;display:flex;min-height:0;position:relative}
.stage{flex:1;position:relative;min-width:0;overflow:hidden;
  background-image:radial-gradient(var(--grid) 1.2px,transparent 1.2px);background-size:26px 26px}
svg#map{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
svg#map.drag{cursor:grabbing}
.link{fill:none;stroke-linecap:round;transition:opacity .25s}
.node{cursor:pointer;transition:opacity .25s}
.node.dim,.link.dim{opacity:.16}
.node rect.body{transition:filter .2s}
.node:hover rect.body{filter:drop-shadow(0 6px 12px rgba(20,30,80,.28))}
.node.sel rect.ring{opacity:1}
.node rect.ring{opacity:0;fill:none;stroke:var(--accent);stroke-width:3}
.node text{font-family:var(--font);pointer-events:none}
.node.hit rect.body{stroke:var(--gold)!important;stroke-width:3!important}
.tog{cursor:pointer}
.tools{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px}
.legend{position:absolute;left:14px;bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:12px;box-shadow:var(--shadow);display:grid;gap:5px;color:var(--muted)}
.legend div{display:flex;align-items:center;gap:8px}
.hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);padding:6px 14px;border-radius:999px;font-size:12px;color:var(--muted);box-shadow:var(--shadow);transition:opacity .6s}

/* drawer */
aside{width:0;overflow:hidden;background:var(--panel);border-left:1px solid var(--line);transition:width .28s cubic-bezier(.2,.8,.2,1);flex:none;z-index:4}
aside.open{width:430px}
.dr{width:430px;height:100%;overflow:auto;padding:20px 22px 40px}
.crumb{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.crumb a{color:var(--muted);text-decoration:none;cursor:pointer}.crumb a:hover{color:var(--accent)}
.dr h2{margin:8px 0 8px;font-size:22px;line-height:1.2}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.badge{font-size:11.5px;padding:3px 10px;border-radius:999px;font-weight:600;border:1px solid var(--line);background:var(--panel2)}
.badge.f{color:#1a8f66}.badge.c{color:#3d55e6}.badge.d{color:#b05bd0}.badge.u{color:#c26a00;border-color:#f0a020}
.ctl{border:1px solid var(--gold);background:color-mix(in srgb,var(--gold) 16%,transparent);cursor:pointer;color:var(--ink)}
.sec{margin:18px 0 6px;font-size:11.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.dr p{margin:0;line-height:1.55}
.callout{background:var(--panel2);border-left:4px solid var(--accent);padding:10px 14px;border-radius:0 12px 12px 0;line-height:1.5}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--panel2);padding:9px 6px;border-radius:12px;font-weight:600;font-size:13px}
.seg button.on[data-s="0"]{background:var(--muted);color:#fff;border-color:transparent}
.seg button.on[data-s="1"]{background:var(--warn);color:#fff;border-color:transparent}
.seg button.on[data-s="2"]{background:var(--ok);color:#fff;border-color:transparent}
.links a{display:flex;gap:8px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;text-decoration:none;color:var(--ink);background:var(--panel2)}
.links a:hover{border-color:var(--accent)}
.links small{color:var(--muted);display:block;font-size:11px}
.ai{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel2)}
.ai .tb{display:flex;gap:2px;padding:6px;border-bottom:1px solid var(--line);background:var(--panel)}
.ai .tb button{flex:1;border:0;background:transparent;padding:6px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.ai .tb button.on{background:var(--accent);color:#fff}
.ai textarea{width:100%;min-height:150px;border:0;background:transparent;color:var(--ink);padding:12px;font:12.5px/1.5 var(--font);resize:vertical;outline:none}
.ai .ft{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-top:1px solid var(--line)}
.btn{border:0;background:var(--accent);color:#fff;padding:8px 14px;border-radius:10px;font-weight:600}
.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
textarea.notes{width:100%;min-height:80px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--ink);padding:10px;font:inherit;resize:vertical}
.kids button{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel2);padding:8px 12px;border-radius:10px;margin-bottom:5px}
.kids button:hover{border-color:var(--accent)}
.nav{display:flex;gap:8px;margin-top:22px}
.nav .btn{flex:1}
.close{position:absolute;right:14px;top:12px}

/* path + controls views */
.view{position:absolute;inset:0;overflow:auto;padding:22px 26px 60px;display:none;background:var(--bg)}
.view.on{display:block}
.view h3{margin:0 0 4px;font-size:20px}
.view .lead{color:var(--muted);margin:0 0 18px}
.dom{background:var(--panel);border:1px solid var(--line);border-radius:18px;margin-bottom:14px;overflow:hidden;box-shadow:0 2px 10px rgba(30,40,90,.05)}
.dom>.h{display:flex;gap:12px;align-items:center;padding:14px 18px;cursor:pointer}
.dom .num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700}
.dom .bar{height:6px;background:var(--panel2);border-radius:99px;flex:0 0 120px;overflow:hidden}
.dom .bar i{display:block;height:100%;border-radius:99px;transition:width .3s}
.dom .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;padding:0 18px 16px}
.item{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:10px 12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.item:hover{border-color:var(--accent)}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted);flex:none;margin-top:1px;display:grid;place-items:center;font-size:11px;color:#fff}
.dot.s1{border-color:var(--warn);background:linear-gradient(90deg,var(--warn) 50%,transparent 50%)}
.dot.s2{border-color:var(--ok);background:var(--ok)}
.item small{display:block;color:var(--muted);margin-top:2px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ccard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer}
.ccard:hover{border-color:var(--gold);transform:translateY(-1px)}
.ccard b{display:inline-block;background:var(--gold);color:#222;padding:1px 9px;border-radius:8px;margin-bottom:6px}
.ccard small{display:block;color:var(--muted);margin-top:8px}

@media(max-width:820px){aside.open{position:absolute;right:0;top:0;bottom:0;width:100%}.dr{width:100%}.brand span{display:none}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><b id="title"></b><span id="subtitle"></span></div>

</header>
<div class="filters" id="filters">

  <button class="chip" id="expand">Expand all</button>
  <button class="chip" id="collapse">Collapse all</button>
</div>
<main>
  <div class="stage" id="stage">
    <svg id="map"><g id="view"><g id="links"></g><g id="nodes"></g></g></svg>
    <div class="hint" id="hint">Click a node to learn it. Click ⊕ to open a branch. Drag to pan, scroll to zoom.</div>

      <div><svg width="14" height="14"><rect width="14" height="14" rx="4" fill="none" stroke="var(--muted)" stroke-width="2"/></svg>Solid edge: foundation or core</div>
      <div><svg width="14" height="14"><rect width="14" height="14" rx="4" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="3 2"/></svg>Dashed edge: deep dive</div>
      <div><span style="width:14px;height:14px;border-radius:50%;background:var(--gold);display:inline-block"></span><span id="goldlbl">Gold badge: audit controls it feeds</span></div>
      <div><span style="width:14px;height:14px;border-radius:50%;background:var(--ok);display:inline-block"></span>Green tick: you got it</div>
    </div>
    <div class="tools">
      <button class="icon-btn" id="zin" title="Zoom in">+</button>
      <button class="icon-btn" id="zout" title="Zoom out">−</button>
      <button class="icon-btn" id="fit" title="Fit to screen (F)">⤢</button>
    </div>
    <div class="view" id="pathv"></div>
    <div class="view" id="ctlv"></div>
  </div>
  <aside id="drawer"><div class="dr" id="dr"></div></aside>
</main>

imary, 5)","u":"https://modelcontextprotocol.io/docs/getting-started/intro"},"o8":{"t":"Managed identities for Azure resources (official, 5)","u":"https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/overview"},"o9":{"t":"What is Azure Resource Manager, scope and resource groups (official, 5)","u":"https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/overview"}},"study_mode":"course","subtitle":"One map for the exam and for reading Foundry app code. Each node says what to learn and why. Claims that rest only on a course transcript are graded 3 in phase1_map.md.","title":"AI-901: Introduction to AI in Azure","tree":{"id":"root","k":[{"id":"d1","k":[{"from":"transcript","id":"d1a","lv":"foundation","s":"Pass mark 700 of 1000. Multiple choice, no penalty for a wrong answer. Study guide: concepts 40 to 45 percent, Foundry implementation 55 to 60 percent.","src":["g1","g2","c02_3_53_4_26","c15_2_41_4_12","c00_introduction_study_resources"],"t":"Exam shape and weights","w":"It sets the depth: read simple Python, do not write complex code."},{"c":["X3","L1"],"from":"transcript","id":"d1b","lv":"foundation","s":"AI is software that imitates human abilities. Machine learning learns patterns from data instead of fixed rules. Workloads: generative and agentic, text, speech, vision, information extraction.","src":["g1","c03_1_42_5_59","c00_what_is_ai"],"t":"AI, ML and workloads","w":"One real task chains several workloads, so you must name each one."},{"c":["X3"],"from":"transcript","id":"d1c","lv":"foundation","s":"An assistant answers a request and a human steers each turn. An agent works toward a goal: it can start on an event, plan steps and act.","src":["g1","c00_assistants_and_agents","c05_5_49_6_51"],"t":"Assistant versus agent","w":"It is the line between a chat app and an automated task."},{"c":["X1"],"from":"transcript","id":"d1d","lv":"core","s":"Fairness, reliability and safety, privacy and security, inclusiveness, transparency, accountability. Each has a test: bias check, fail safe, protected data, works for all users, explainable, a person responsible.","src":["g1","c03_6_09_9_54","c00_responsible_ai"],"t":"Six responsible AI principles","w":"The study guide asks you to describe considerations for each one."},{"c":["X1","L1"],"from":"transcript","id":"d1e","lv":"dive","s":"Map each principle to a setting: guardrails for safety, Entra and private networking for security, human approval of tool calls for accountability.","src":["o4","o10","o6","c08_18_35_21_22","c03_22_36_23_34"],"t":"Principles become controls","w":"It turns six words into settings you can audit."}],"lv":"foundation","s":"What AI is, which workloads exist, and the six principles. The study guide gives concepts 40 to 45 percent of the exam.","t":"AI concepts and responsible AI"},{"id":"d2","k":[{"from":"transcript","id":"d2a","lv":"foundation","s":"A tenant is your organization's Entra directory. Users, groups, apps, managed identities and agents get identities there. A subscription trusts one tenant.","src":["o8","c04_3_16_3_46","c00_azure_and_entra"],"t":"Tenant and Entra ID","w":"Identity decides who may call a model, and Entra is the keyless way."},{"from":"transcript","id":"d2b","lv":"foundation","s":"A subscription is a cost and access boundary. A resource group holds related resources: each sits in one group, groups do not nest, settings flow down.","src":["o9","c04_3_46_5_17","c00_azure_and_entra"],"t":"Subscription and resource group","w":"Roles and policy follow this tree."},{"c":["L2"],"from":"transcript","id":"d2c","lv":"core","s":"The Foundry resource is the governance layer: networking, security, deployments. A project is an isolated workspace for one app or agent, with its own agents, files and evaluations.","src":["o10","c04_6_24_7_28","c00_microsoft_foundry"],"t":"Foundry resource and project","w":"Endpoints, roles and quotas attach to one of these two levels."},{"c":["L2"],"from":"transcript","id":"d2d","lv":"core","s":"Portal ai.azure.com: Discover finds models and tools. Build holds agents, models, services, knowledge, guardrails. Operate and Admin cover assets, quota, projects. Delete lab resources after use.","src":["c04_15_29_15_45_21_34_31_00_51_21_51_40","c00_microsoft_foundry"],"t":"Portal map and lab hygiene","w":"It guides every lab and avoids surprise cost."}],"lv":"foundation","s":"Where AI lives in Azure and who may use it. You know cloud, so read this for the Foundry names.","t":"Azure, Entra and Foundry"},{"id":"d3","k":[{"c":["X2"],"from":"transcript","id":"d3a","lv":"foundation","s":"LLMs have billions of parameters. SLMs are smaller, often distilled, faster and cheaper. Both are generative. Inference is a model producing output from input.","src":["g1","c00_generative_ai","c05_3_39_4_50"],"t":"LLM and SLM","w":"Model size trades power against speed and cost."},{"c":["X2"],"from":"transcript","id":"d3b","lv":"foundation","s":"A token is a word, part of a word or punctuation. The model reads and writes tokens. The playground shows input and output tokens apart.","src":["c00_generative_ai","c05_7_22_7_52","c06_17_58_18_40"],"t":"Tokens","w":"Tokens set limits and cost, and chat history adds input tokens."},{"c":["X4","L3","L13"],"from":"transcript","id":"d3c","lv":"core","s":"The system prompt (instructions) sets role, format and limits. The user prompt is the request. Chat Completions sends role messages. The Responses API takes instructions plus input.","src":["g1","o15","c00_custom_ai_app","c05_17_20_18_17","c06_8_04_9_16"],"t":"System and user prompt","w":"It is the cheapest control on model behavior."},{"c":["X2","L3"],"from":"transcript","id":"d3d","lv":"core","s":"Temperature and top P set randomness: low is focused, high is varied. Max tokens caps the reply. A repetition penalty cuts repeated text. Newer models may not expose temperature.","src":["g1","c05_21_23_21_58","c06_9_16_10_10","c00_custom_ai_app"],"t":"Sampling parameters","w":"Low suits a legal summary. High suits marketing copy."},{"c":["X2"],"from":"transcript","id":"d3e","lv":"core","s":"An embedding is a vector of numbers for meaning: close vectors mean similar meaning. Attention weights which tokens matter in context. The model predicts the next token, adds it and repeats.","src":["o14","a1","c05_7_52_10_30","c00_embeddings"],"t":"Embeddings and attention","w":"Embeddings power semantic search, which grounds agents."},{"c":["X2"],"from":"transcript","id":"d3f","lv":"core","s":"Modality is a kind of data: text, audio, image, video, code. Multimodal: one model takes or gives more than one. Multimodel: an app chains several models.","src":["g1","c00_generative_ai","c12_2_10_5_19"],"t":"Multimodal versus multimodel","w":"One letter apart, two ideas."}],"lv":"core","s":"The model ideas behind every Foundry call. Read these before the code.","t":"How generative AI models work"},{"id":"d4","k":[{"c":["X2"],"from":"transcript","id":"d4a","lv":"foundation","s":"The catalog lists thousands of models: sold directly by Azure, or from partners and the community. Choose by task, quality, cost and latency, not by name.","src":["g1","c06_2_39_4_14","c12_5_34_8_33","c00_microsoft_foundry"],"t":"Model catalog and choice","w":"One catalog serves chat, image, video and speech models."},{"c":["X4","L2"],"from":"transcript","id":"d4b","lv":"foundation","s":"A model must be deployed into a project before an app can call it. Default settings are quick. Custom settings show version, type, token rate and guardrail.","src":["o1","c04_36_00_38_12","c06_21_25_22_29","c00_models"],"t":"Deploy before use","w":"The deployment name is what code passes as the model."},{"c":["X2","L2"],"from":"transcript","id":"d4c","lv":"core","s":"Global: any region. Data Zone: inside a US, EU or APAC zone. Regional (docs: Standard): one geography. Each can be pay-per-token, provisioned or batch.","src":["o1","c00_models","c06_4_23_4_54","c04_37_48_37_59"],"t":"Deployment types","w":"It sets where prompts are processed, how you pay and latency."},{"c":["X2"],"from":"transcript","id":"d4d","lv":"core","s":"Provisioned throughput units (PTU) reserve capacity for steady latency. Priority is a faster pay-as-you-go tier on Standard types. Flex is the cheap, delay-tolerant tier.","src":["o1","c00_models","c04_30_29_30_47"],"t":"PTU and priority","w":"Reserved capacity versus pay per token is the contrast to know."},{"c":["X1","X2","L1","L2"],"from":"transcript","id":"d4e","lv":"core","s":"A guardrail is a named set of controls. Each names a risk, where to scan and an action (annotate or block). Models default to Microsoft.DefaultV2. Severity: low, medium, high.","src":["o4","c00_models","c04_27_08_27_57","c06_5_56_6_27"],"t":"Guardrails","w":"It is the safety setting on every deployment."},{"c":["X1"],"id":"d4f","lv":"dive","s":"An agent guardrail fully replaces the model's guardrail. Agents add two scan points, tool call and tool response, in preview. Prompt attacks and indirect attacks are risk types.","src":["o4","o3"],"t":"Agent guardrails","w":"A tool response is untrusted input to the agent."}],"lv":"core","s":"Pick a model, deploy it, set where it runs and how it is filtered.","t":"Models, deployment and guardrails"},{"id":"d5","k":[{"c":["X4","L2"],"from":"transcript","id":"d5a","lv":"foundation","s":"An endpoint is an HTTPS URL for a Foundry resource or project. Calls are JSON over REST. A project shows two: a project endpoint and an Azure OpenAI endpoint.","src":["o15","c04_10_21_13_01_16_56_17_12_40_20_40_41","c00_endpoints_keys_and_entra_auth"],"t":"Endpoint and REST","w":"Same HTTP you know, with a model behind it."},{"c":["X4"],"from":"transcript","id":"d5b","lv":"core","s":"An SDK wraps the REST call and often the sign-in. Course packages: openai, azure-identity, TextAnalyticsClient (Language), the Speech SDK, a Content Understanding client.","src":["c00_app_integration_with_foundry","c04_13_05_13_43","c08_10_07_10_21"],"t":"The SDK","w":"You read a flow: import, configure, create client, call, read result."},{"c":["X4","L3","L13"],"from":"transcript","id":"d5c","lv":"core","s":"Read it in five steps: import, endpoint and model, auth, call, print the reply. Everything later in the course varies this.","src":["g1","c00_foundry_generated_code_custom_ai_app","c06_21_19_24_21","c05_23_40_25_30"],"t":"Chat client code","w":"The exam checks that you can say what each part does."},{"c":["X4","L4"],"from":"transcript","id":"d5d","lv":"core","s":"Chat Completions sends a list of role and content messages. The Responses API takes model, instructions and input, and works with models and agents. The Code tab switches between them.","src":["o15","c06_20_13_21_01_22_46_23_07","c00_foundry_generated_code"],"t":"Completions versus Responses API","w":"Same job, two call shapes. Know the method names."},{"c":["X4","L2"],"from":"transcript","id":"d5e","lv":"core","s":"A key in a header is a shared secret: whoever holds it can call you. Keep it in an environment variable or Key Vault, never in code or git. Two keys allow rotation.","src":["o2","o15","c00_endpoints_keys_and_entra_auth_app_integration_with_foundry","c04_20_06_20_32"],"t":"API keys","w":"Entra swaps the secret for an identity."},{"c":["X4","L2","L13"],"from":"transcript","id":"d5f","lv":"core","s":"Token scope: https://ai.azure.com/.default, sent as a bearer token. Python: DefaultAzureCredential and get_bearer_token_provider. The caller needs the Cognitive Services User role on the Foundry resource.","src":["o2","c06_23_14_24_21","c00_endpoints_keys_and_entra_auth_custom_ai_app","c04_40_42_45_45"],"t":"Entra ID tokens","w":"Access becomes a role you can grant and revoke."},{"c":["X4"],"from":"transcript","id":"d5g","lv":"core","s":"A managed identity is an Entra identity Azure gives a resource, such as a VM or app. Code gets tokens with no stored secret. System-assigned ends with the resource; user-assigned can be shared.","src":["o8","o2","c00_endpoints_keys_and_entra_auth"],"t":"Managed identity","w":"It is the keyless answer inside Azure."},{"c":["L2"],"from":"transcript","id":"d5h","lv":"dive","s":"The resource owner can disable key access so only Entra works. The portal then greys out key 1 and key 2. The Ep 3 lab runs this way.","src":["c04_17_47_18_00_20_14_20_32"],"t":"Switch keys off","w":"Keyless is a setting, not only a code choice."}],"lv":"core","s":"Endpoint, REST, SDK and three ways to prove who you are. This is the Foundry app code the study guide wants you to read.","t":"Calling Foundry from code"},{"id":"d6","k":[{"c":["X4"],"from":"transcript","id":"d6a","lv":"foundation","s":"A prompt agent is no code: instructions, model and tools that Foundry runs. A hosted agent is your container, run by Foundry with a managed endpoint and its own Entra identity.","src":["o3","c00_agents","c06_11_10_15_12"],"t":"Prompt versus hosted agent","w":"Choose: least to manage, or full control."},{"c":["X4","L4"],"from":"transcript","id":"d6b","lv":"core","s":"Tools let an agent act: file search, web search, code interpreter, custom functions, MCP servers. MCP, the Model Context Protocol, is an open standard that connects AI apps to tools, data and workflows.","src":["o3","o7","c04_8_47_9_27","c00_tools_and_knowledge_looking_at_an_agent"],"t":"Tools and MCP","w":"Without tools an agent only talks."},{"c":["X4","L3","L4"],"from":"transcript","id":"d6c","lv":"core","s":"Knowledge grounds answers in your data instead of training data. In Foundry it is an uploaded file with a vector index, or Azure AI Search knowledge bases.","src":["o13","c04_9_27_10_06","c06_31_19_33_45","c00_looking_at_an_agent"],"t":"Knowledge and Azure AI Search","w":"A model alone does not know your files or policies."},{"c":["X4","L4"],"from":"transcript","id":"d6d","lv":"core","s":"Test in the playground, save the setup as a named agent, read its YAML (kind prompt, model, instructions, tools), then call it by name and version with the project client.","src":["g1","o3","c06_27_55_39_41"],"t":"Portal to client app","w":"The study guide's path: create, test, call."},{"c":["X1"],"from":"transcript","id":"d6e","lv":"dive","s":"Tool calls need approval: once, always for one tool, or always for all. An agent can have its own Entra identity and role, so you can audit and limit it.","src":["o3","c08_20_11_20_48","c04_34_22_35_36","c00_azure_and_entra"],"t":"Approval and agent identity","w":"An acting agent needs least privilege, like any service account."},{"c":["X4"],"from":"transcript","id":"d6f","lv":"dive","s":"Several agents can split a job: one gathers, one summarizes, one acts. Foundry offers sequential, human-in-the-loop and group-chat workflows.","src":["g1","c05_13_52_14_15","c04_25_10_25_22"],"t":"Multi-agent workflows","w":"Know the idea. The study guide tests a single-agent solution."}],"lv":"core","s":"A model plus instructions plus tools. Build in the portal, run from code.","t":"Agents"},{"id":"d7","k":[{"c":["X3","L5"],"from":"transcript","id":"d7a","lv":"foundation","s":"Key terms show topics. Entities show who, where and when. Sentiment gives tone. Classification gives a category. Summarization gives the core message.","src":["g1","c07_0_35_6_05","c00_natural_language_processing"],"t":"Text analysis tasks","w":"The study guide names keyword extraction, entity detection, sentiment and summarization."},{"c":["X3","X5","L6"],"from":"transcript","id":"d7b","lv":"core","s":"A general model does many tasks from one prompt, but replies can vary. Azure Language is preconfigured and returns structured, repeatable results. Use a model to explore. Use Language in pipelines.","src":["o11","c08_0_38_9_19","c00_natural_language_processing"],"t":"Prompted model or Azure Language","w":"This choice is the core text-analysis question."},{"c":["X5","L6"],"from":"transcript","id":"d7c","lv":"core","s":"Core: PII detection, language detection, entity recognition, health text. Key phrases, sentiment and summarization are labelled legacy. Code: TextAnalyticsClient with endpoint and key. Agents use the Language MCP server.","src":["o11","c08_14_33_21_22","c08_29_58_30_26"],"t":"Azure Language features and code","w":"The exam names features the docs call legacy. Know both views."},{"c":["X3"],"from":"transcript","id":"d7d","lv":"dive","s":"Classic pipeline: tokenize, normalize, drop stop words, stem or lemmatize, tag parts of speech. Statistical methods count: term frequency, TF-IDF, bag of words, TextRank. Semantic models use embeddings.","src":["c07_6_54_16_20","c00_natural_language_processing"],"t":"Preprocessing and statistics","w":"Managed services do this for you, so you need only the vocabulary."}],"lv":"core","s":"Text analysis two ways: a prompted model or a purpose-built service.","t":"NLP and Azure Language"},{"id":"d8","k":[{"c":["X3","L7"],"from":"transcript","id":"d8a","lv":"foundation","s":"Speech recognition turns spoken audio into text. Speech synthesis turns text into spoken audio. Assistants, transcripts, call centers and accessibility tools use both.","src":["o12","c09_1_41_5_08","c00_speech"],"t":"Speech to text and text to speech","w":"Name the direction and you have named the workload."},{"c":["X5","L7","L8"],"from":"transcript","id":"d8b","lv":"core","s":"Azure Speech runs from the playground (no code), from the Speech SDK (config with endpoint and key, audio config, recognizer or synthesizer), or as an agent tool through MCP.","src":["o12","c10_1_27_6_52_6_52_14_00"],"t":"Azure Speech three ways","w":"Same service, three entry points: explore, build, automate."},{"c":["X5","L8"],"from":"transcript","id":"d8c","lv":"core","s":"Voice Live runs a real-time spoken conversation with a generative model that has instructions and tools. It handles listening, speaking, noise and interruptions. A voice-based prompt agent uses it.","src":["o12","o3","c10_14_00_17_42"],"t":"Voice Live","w":"Chaining the two steps feels slow."},{"c":["X3"],"from":"transcript","id":"d8d","lv":"dive","s":"Recognition: capture audio, extract features, acoustic model to phonemes, language model to words, post-process. Synthesis: normalize text, map to phonemes, add prosody, generate the waveform.","src":["c09_5_08_12_10"],"t":"Speech pipelines","w":"Context picks the right word when two words sound alike."}],"lv":"core","s":"Two directions: audio to text, and text to audio.","t":"Speech"},{"id":"d9","k":[{"c":["X3","L9"],"from":"transcript","id":"d9a","lv":"foundation","s":"Classification gives one label per image. Detection gives what and where, with boxes. Semantic segmentation labels every pixel. Contextual analysis says what is happening.","src":["g1","c11_1_21_5_28","c00_computer_vision"],"t":"Vision tasks","w":"Each task answers a different question, so you pick by question."},{"c":["X6","L9","L10"],"from":"transcript","id":"d9b","lv":"core","s":"Send text and an image in one prompt. The image goes as a URL or as base64 text. The model reads both together and answers in text.","src":["g1","c12_2_10_5_19"],"t":"Multimodal prompts","w":"It is how a chat model reads visual input in code."},{"c":["X6","L10"],"from":"transcript","id":"d9c","lv":"core","s":"Search the catalog by task: text to image, image to image, video. Course models: GPT image, FLUX.2-pro, FLUX.1-Kontext-pro, sora-2. Choose by task, quality, cost, latency. Code: images.generate.","src":["g1","c12_5_34_8_33_16_20_24_03","c00_image_and_video_generation"],"t":"Image and video generation","w":"Names change, so check the catalog."},{"c":["X6"],"from":"transcript","id":"d9d","lv":"core","s":"Training adds noise to images in steps and teaches the model to reverse it. Generation starts from noise and removes it in steps guided by the prompt. Video repeats this across frames.","src":["a3","c11_9_47_12_42","c00_image_and_video_generation"],"t":"Diffusion models","w":"Hence the steps, time and cost."},{"c":["X3"],"from":"transcript","id":"d9e","lv":"dive","s":"A CNN slides filters over an image, builds feature maps, then predicts probabilities. A vision transformer cuts the image into patches, turns each into a vector and uses attention.","src":["a2","c11_5_32_9_35","c00_computer_vision"],"t":"CNN versus vision transformer","w":"Local patterns versus global context is the contrast to remember."}],"lv":"core","s":"Understand images, send images to models, and generate images and video.","t":"Computer vision and generation"},{"id":"d10","k":[{"c":["X3","X7","L11"],"from":"transcript","id":"d10a","lv":"foundation","s":"OCR reads text from images and scans. It gives text, not meaning: it does not know that 23.50 is a total. It is the first step of most document flows.","src":["g1","c13_4_23_8_37","c00_information_extraction"],"t":"OCR","w":"Do not confuse reading text with understanding fields."},{"c":["X7","L11"],"from":"transcript","id":"d10b","lv":"core","s":"Field extraction maps OCR text to named fields such as vendor, date and total. Steps: ingest OCR output with position and confidence, detect candidates, map, normalize, send to systems.","src":["g1","c13_8_37_12_30"],"t":"Field extraction","w":"OCR says what text exists. Field extraction says what it means."},{"c":["X7","L12"],"from":"transcript","id":"d10c","lv":"core","s":"Content Understanding handles documents, images, audio and video. Prebuilt analyzers fit invoices and receipts. Custom analyzers use your schema. Output: JSON or Markdown, with confidence scores.","src":["g1","o5","c14_1_37_6_57","c00_information_extraction"],"t":"Content Understanding analyzers","w":"Call it by REST or SDK and pass the JSON on."},{"c":["X7","L12"],"from":"transcript","id":"d10d","lv":"dive","s":"The same analyzer idea runs on audio (transcripts, topics) and video (key moments, speech). Open question: the docs say it uses generative AI; the cram calls it more deterministic than an LLM.","src":["o5","c14_4_44_7_00","c00_information_extraction"],"t":"Audio and video extraction","w":"Treat the cram's claim as unverified."}],"lv":"core","s":"Turn receipts, forms, audio and video into structured data.","t":"Information extraction"}],"s":"Course map for the Microsoft Azure AI Fundamentals exam, with Foundry app code in view. Study guide weights: concepts 40 to 45 percent, Foundry implementation 55 to 60 percent.","t":"AI-901: Introduction to AI in Azure"},"ui":{"anchor":"Anchor","anchors":"Exam skills and labs","context":"the Microsoft Azure AI Fundamentals exam AI-901 and the Microsoft Learn course Introduction to AI in Azure, which uses Microsoft Foundry","critical":"Exam or lab anchor","feeds":"It feeds these exam skills and lab checks","labels":{"challenge":"Quiz me","deeper":"Go deeper","evidence":"Hands-on check","explain":"Explain"},"learner":"I am an application security practitioner. I know cloud, HTTP, REST and auth. I am new to AI services in Azure. I am preparing for exam AI-901 and I want to read Foundry app code.","prompts":{"challenge":"Quiz me one multiple-choice question at a time, in AI-901 style, on this topic. Give a hint before the answer. After five questions, list my gaps and name the Microsoft Learn module or lab to repeat.","deeper":"Go one level deeper: where this fails or is misused, what a security reviewer would check in the code or the setup, and what the official docs say that the course video did not. Cite official Microsoft pages and say where you are unsure.","evidence":"Give me one hands-on check for this in Microsoft Foundry, in my own Azure subscription or trial only. Say what to click or run, what output shows it worked, and which resources to delete afterwards. Do not touch any account or resource I do not own.","explain":"Explain this AI-901 idea in plain, short sentences. Define each term at first use. I know cloud, HTTP, REST and auth, so skip those basics and link the idea to them. Say which parts come from Microsoft documentation and which you could not verify."},"why":"Why it matters for AI-901 and Foundry code"}}</script>
<script>
(()=>{
const D = JSON.parse(document.getElementById('data').textContent);
const KEY = 'mindmap:' + D.slug;
const U = Object.assign({
  anchors:'Audit controls', anchor:'Control', critical:'Audit-critical', why:'Why it matters in the audit', feeds:'It feeds these audit controls',
  learner:'I have basic computer literacy and no background in this topic.', context:D.title,
  labels:{explain:'Explain',evidence:'Evidence',challenge:'Quiz me',deeper:'Go deeper'},
  prompts:{
    explain:'Explain it in plain language, one idea at a time. Define every term the first time you use it. Give one concrete example with real-looking values. Then tell me the two most common mistakes people make. Cite official documentation and say if anything may have changed recently.',
    evidence:'Show me how to collect audit evidence for this: the exact console path and command. Give an example of a PASSING result and a FAILING result, and a one-paragraph finding I could write for the failing one. Do not assume I can build anything; I only review.',
    challenge:'Teach me by asking. Ask me one question at a time, start easy, and wait for my answer before continuing. When I am wrong, do not just give the answer: hint first. After five questions, tell me what I still have a gap in and what to read.',
    deeper:'I understand the basics already. Go one level deeper: how does it actually work inside, what are the edge cases, and how would a misconfiguration or an attacker abuse it? Then tell me how to transfer this to a different case.'
  }
}, D.ui||{});
const PK = ['explain','evidence','challenge','deeper'].filter(k=>U.prompts[k]).concat(Object.keys(U.prompts).filter(k=>!['explain','evidence','challenge','deeper'].includes(k)).sort());
const HAS_ANCHORS = Object.keys(D.controls||{}).length>0;
const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const el = (n, a={}, p) => { const e=document.createElementNS(NS,n); for(const k in a) e.setAttribute(k,a[k]); if(p)p.appendChild(e); return e; };
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- state ---------- */
let saved = {}; try{ saved = JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){}
const S = {
  status: saved.status||{}, notes: saved.notes||{}, theme: saved.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'),
  collapsed: new Set(saved.collapsed||[]), first: saved.first===undefined,
  sel: null, q:'', filter:'all', control:null, view:'map', aiMode:'explain'
};
const persist = ()=>localStorage.setItem(KEY, JSON.stringify({status:S.status,notes:S.notes,theme:S.theme,collapsed:[...S.collapsed],first:false}));

/* ---------- tree ---------- */
const N = {}; const order = [];
const HUES = [222,160,32,280,350,190,96,18,250,322];
(function walk(n, parent, depth, dom){
  n.parent=parent; n.depth=depth; n.kids=n.k||[]; N[n.id]=n; order.push(n);
  if(depth===1){ dom = HUES[(order.filter(x=>x.depth===1).length-1)%HUES.length]; n.num=order.filter(x=>x.depth===1).length; }
  n.hue = depth===0?232:dom;
  n.kids.forEach(c=>walk(c,n,depth+1,dom));
  n.dom = depth===0?null:(depth===1?n:parent.dom);
})(D.tree,null,0,0);
const root = D.tree;
if(S.first){ order.forEach(n=>{ if(n.depth===1 && n.id!=='d1') S.collapsed.add(n.id); }); }
const leafish = order.filter(n=>n.depth>0);
const crit = n => (n.c||[]).length>0;

/* ---------- theme / header ---------- */
function applyTheme(){ document.documentElement.dataset.theme=S.theme; }
applyTheme();
$('#title').textContent = D.title; $('#subtitle').textContent = D.subtitle; document.title = D.title+' | mind map';
$('#theme').onclick=()=>{S.theme=S.theme==='dark'?'light':'dark';applyTheme();persist();renderAll();};
function progress(){
  const done = leafish.filter(n=>S.status[n.id]===2).length, tot = leafish.length;
  const p = Math.round(done/tot*100);
  $('#pct').textContent = p+'%'; $('#cnt').textContent = done+' of '+tot+' topics';
  $('#ring').style.strokeDashoffset = 94.2*(1-done/tot);
}
function domProgress(n){
  const d=[]; (function g(x){ x.kids.forEach(c=>{d.push(c);g(c)}) })(n);
  const done=d.filter(c=>S.status[c.id]===2).length; return {done,tot:d.length};
}

/* ---------- matching ---------- */
function matches(n){
  if(S.q){ const t=(n.t+' '+(n.s||'')+' '+(n.w||'')+' '+(n.c||[]).join(' ')).toLowerCase(); if(!S.q.split(/\s+/).every(w=>t.includes(w))) return false; }
  if(S.control && !(n.c||[]).includes(S.control)) return false;
  switch(S.filter){
    case 'crit': return crit(n);
    case 'foundation': case 'core': case 'dive': return n.lv===S.filter;
    case 'todo': return S.status[n.id]!==2;
  }
  return true;
}
const filtering = ()=> !!S.q || !!S.control || S.filter!=='all';
function hasMatchBelow(n){ return n.kids.some(c=>matches(c)||hasMatchBelow(c)); }
function litSet(){
  const s=new Set(); if(!filtering()) return null;
  order.forEach(n=>{ if(n.depth>0 && matches(n)){ s.add(n.id); let p=n.parent; while(p){s.add(p.id);p=p.parent;} } });
  return s;
}

/* ---------- map ---------- */
const svg=$('#map'), view=$('#view'), gL=$('#links'), gN=$('#nodes');
const cx=document.createElement('canvas').getContext('2d');
let T={k:1,x:40,y:0};
const ROW=50, GAP=84, H=36;
const pos={}, tgt={}, els={}, linkEls={};
function textW(n){ cx.font = (n.depth<=1?'700 14px ':'600 13px ')+'Segoe UI, system-ui, sans-serif'; return cx.measureText(n.t).width; }
function width(n){ const extra = (n.kids.length?34:0) + (crit(n)?26:0) + 38; return Math.min(300, Math.max(n.depth===0?170:110, textW(n)+extra)); }
function visibleKids(n){ return S.collapsed.has(n.id)?[]:n.kids; }

function layout(){
  const cols=[]; let leaf=0; const vis=[];
  (function pass(n){
    vis.push(n); n.bw=width(n); cols[n.depth]=Math.max(cols[n.depth]||0,n.bw);
    const k=visibleKids(n);
    if(!k.length){ n.ty=leaf*ROW; leaf++; }
    else { k.forEach(pass); n.ty=(k[0].ty+k[k.length-1].ty)/2; }
  })(root);
  const xs=[0]; for(let i=1;i<cols.length;i++) xs[i]=xs[i-1]+cols[i-1]+GAP;
  vis.forEach(n=>{ n.tx=xs[n.depth]; tgt[n.id]={x:n.tx,y:n.ty}; });
  return vis;
}

function makeNode(n){
  const g=el('g',{class:'node'},gN);
  const w=n.bw, h=H+(n.depth===0?10:0);
  el('rect',{class:'ring',x:-5,y:-5,width:w+10,height:h+10,rx:16},g);
  const body=el('rect',{class:'body',width:w,height:h,rx:13},g);
  const dom = n.depth<=1;
  const hue=n.hue;
  const dark=S.theme==='dark';
  if(n.depth===0){
    const id='grad';
    body.setAttribute('fill','url(#rootgrad)'); body.setAttribute('stroke','none');
  } else if(dom){
    body.setAttribute('fill',`hsl(${hue} 70% ${dark?42:50}%)`); body.setAttribute('stroke','none');
  } else {
    body.setAttribute('fill',dark?`hsl(${hue} 28% 18%)`:`hsl(${hue} 90% 97%)`);
    body.setAttribute('stroke',`hsl(${hue} 65% ${dark?55:58}%)`); body.setAttribute('stroke-width',2);
    if(n.lv==='dive') body.setAttribute('stroke-dasharray','5 4');
  }
  const col = dom?'#fff':(dark?'#eef0ff':'#1b2040');
  const tx = n.depth===0?18:(dom?(n.num?38:16):32);
  if(n.depth===1){ el('circle',{cx:20,cy:h/2,r:11,fill:'rgba(255,255,255,.25)'},g); const t=el('text',{x:20,y:h/2+4.5,'text-anchor':'middle',fill:'#fff','font-size':12,'font-weight':700},g); t.textContent=n.num; }
  const t=el('text',{x:tx,y:h/2+5,fill:col,'font-size':n.depth<=1?14:13,'font-weight':n.depth<=1?700:600},g); t.textContent=n.t;
  if(n.depth>1){ n.sdot = el('g',{transform:`translate(16 ${h/2})`},g); }
  // badge
  let bx=w-(n.kids.length?30:12);
  if(crit(n)){ const b=el('g',{transform:`translate(${bx-10} ${h/2})`},g); el('circle',{r:9,fill:'var(--gold)'},b); const bt=el('text',{y:4,'text-anchor':'middle','font-size':10.5,'font-weight':800,fill:'#222'},b); bt.textContent=n.c.length; }
  if(n.kids.length){
    const tg=el('g',{class:'tog',transform:`translate(${w} ${h/2})`},g);
    el('circle',{r:11,fill:'var(--panel)',stroke:dom||n.depth===0?`hsl(${hue} 65% 55%)`:`hsl(${hue} 60% 55%)`,'stroke-width':2},tg);
    n.tgl=el('text',{y:4.5,'text-anchor':'middle','font-size':14,'font-weight':700,fill:'var(--ink)'},tg);
    tg.addEventListener('click',e=>{e.stopPropagation();toggle(n);});
    tg.addEventListener('pointerdown',e=>e.stopPropagation());
  }
  g.addEventListener('click',()=>select(n.id,true));
  g.addEventListener('pointerdown',e=>e.stopPropagation());
  g.addEventListener('dblclick',e=>{ if(n.kids.length) toggle(n); });
  const title=el('title',{},g); title.textContent=n.t;
  return g;
}
function statusDot(n){
  if(!n.sdot) return; n.sdot.innerHTML='';
  const s=S.status[n.id]||0;
  if(s===2){ el('circle',{r:8,fill:'var(--ok)'},n.sdot); const p=el('path',{d:'M-4 0.5l3 3 5-6',stroke:'#fff','stroke-width':2.2,fill:'none','stroke-linecap':'round','stroke-linejoin':'round'},n.sdot); }
  else if(s===1){ el('circle',{r:7,fill:'none',stroke:'var(--warn)','stroke-width':2},n.sdot); el('path',{d:'M0 -7A7 7 0 0 1 0 7Z',fill:'var(--warn)'},n.sdot); }
  else el('circle',{r:7,fill:'none',stroke:'var(--muted)','stroke-width':1.8,opacity:.7},n.sdot);
}
function linkPath(a,b,aw){
  const x1=a.x+aw, y1=a.y+H/2+(0), x2=b.x, y2=b.y+H/2, mx=(x1+x2)/2;
  return `M${x1+11} ${y1} C${mx} ${y1},${mx} ${y2},${x2} ${y2}`;
}

let anim=null;
function render(init){
  const vis=layout(); const lit=litSet();
  const visIds=new Set(vis.map(n=>n.id));
  svg.querySelector('defs')||(()=>{ const d=el('defs',{},svg); const lg=el('linearGradient',{id:'rootgrad',x1:0,y1:0,x2:1,y2:1},d); el('stop',{offset:0,'stop-color':'#5b6cff'},lg); el('stop',{offset:1,'stop-color':'#b25bff'},lg); })();
  // remove old
  for(const id in els){ if(!visIds.has(id)){ els[id].remove(); delete els[id]; delete pos[id]; } }
  for(const id in linkEls){ if(!visIds.has(id)){ linkEls[id].remove(); delete linkEls[id]; } }
  vis.forEach(n=>{
    if(!els[n.id]){ els[n.id]=makeNode(n); const p=n.parent&&pos[n.parent.id]; pos[n.id]=p?{x:p.x,y:p.y}:{x:tgt[n.id].x,y:tgt[n.id].y}; }
    else if(init||n._theme!==S.theme){ els[n.id].remove(); els[n.id]=makeNode(n); }
    n._theme=S.theme;
    const g=els[n.id];
    g.classList.toggle('sel',S.sel===n.id);
    g.classList.toggle('dim',!!lit && !lit.has(n.id));
    g.classList.toggle('hit',!!lit && n.depth>0 && matches(n));
    if(n.tgl) n.tgl.textContent = S.collapsed.has(n.id)? '+' : '−';
    statusDot(n);
    if(n.parent && !linkEls[n.id]){ linkEls[n.id]=el('path',{class:'link'},gL); }
    if(n.parent){ const l=linkEls[n.id]; const dark=S.theme==='dark'; l.setAttribute('stroke',`hsl(${n.hue} 60% ${dark?55:62}%)`); l.setAttribute('stroke-width',n.depth===1?3.2:2); l.setAttribute('stroke-dasharray',n.lv==='dive'?'6 5':'none'); l.classList.toggle('dim',!!lit && !lit.has(n.id)); l.style.opacity=lit&&!lit.has(n.id)?'':'.75'; }
  });
  // domain progress label
  vis.filter(n=>n.depth===1).forEach(n=>{ const g=els[n.id]; g.querySelector('title').textContent=n.t+'  ('+domProgress(n).done+'/'+domProgress(n).tot+' done)'; });
  progress();
  start(vis);
}
function start(vis){
  const t0=performance.now(), from={}; vis.forEach(n=>from[n.id]={x:pos[n.id].x,y:pos[n.id].y});
  cancelAnimationFrame(anim);
  const step=now=>{
    const k=Math.min(1,(now-t0)/320), e=1-Math.pow(1-k,3);
    vis.forEach(n=>{ const f=from[n.id],t=tgt[n.id]; pos[n.id]={x:f.x+(t.x-f.x)*e,y:f.y+(t.y-f.y)*e}; els[n.id].setAttribute('transform',`translate(${pos[n.id].x} ${pos[n.id].y-(n.depth===0?5:0)})`); });
    vis.forEach(n=>{ if(n.parent){ linkEls[n.id].setAttribute('d',linkPath(pos[n.parent.id],pos[n.id],n.parent.bw)); } });
    if(k<1) anim=requestAnimationFrame(step);
  };
  anim=requestAnimationFrame(step);
}
function toggle(n){ if(S.collapsed.has(n.id)) S.collapsed.delete(n.id); else S.collapsed.add(n.id); persist(); render(); }
function expandTo(n){ let p=n.parent; let ch=false; while(p){ if(S.collapsed.delete(p.id)) ch=true; p=p.parent; } return ch; }

/* ---------- pan / zoom ---------- */
function applyT(smooth){ view.style.transition=smooth?'transform .45s cubic-bezier(.2,.8,.2,1)':'none'; view.setAttribute('style',view.getAttribute('style')); view.style.transform=`translate(${T.x}px,${T.y}px) scale(${T.k})`; view.style.transformOrigin='0 0'; }
function fit(smooth=true){
  const vis=order.filter(n=>tgt[n.id]&&els[n.id]); if(!vis.length) return;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; vis.forEach(n=>{ x0=Math.min(x0,tgt[n.id].x); y0=Math.min(y0,tgt[n.id].y); x1=Math.max(x1,tgt[n.id].x+n.bw+14); y1=Math.max(y1,tgt[n.id].y+H+8); });
  const r=svg.getBoundingClientRect(), pad=60;
  const k=Math.max(.35,Math.min(1.15,(r.width-pad*2)/(x1-x0),(r.height-pad*2)/(y1-y0)));
  T={k,x:(r.width-(x1-x0)*k)/2-x0*k,y:(r.height-(y1-y0)*k)/2-y0*k}; applyT(smooth);
}
function focusNode(id){
  const n=N[id]; if(!tgt[id]) return; const r=svg.getBoundingClientRect();
  T.x=r.width*0.38-(tgt[id].x+n.bw/2)*T.k; T.y=r.height/2-(tgt[id].y+H/2)*T.k; applyT(true);
}
let drag=null;
svg.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY,tx:T.x,ty:T.y}; svg.classList.add('drag'); svg.setPointerCapture(e.pointerId); $('#hint').style.opacity=0; });
svg.addEventListener('pointermove',e=>{ if(!drag) return; T.x=drag.tx+e.clientX-drag.x; T.y=drag.ty+e.clientY-drag.y; applyT(false); });
const endDrag=()=>{ drag=null; svg.classList.remove('drag'); };
svg.addEventListener('pointerup',endDrag); svg.addEventListener('pointercancel',endDrag);
svg.addEventListener('wheel',e=>{
  e.preventDefault(); const r=svg.getBoundingClientRect(); const mx=e.clientX-r.left,my=e.clientY-r.top;
  const k2=Math.max(.25,Math.min(2.5,T.k*Math.exp(-e.deltaY*0.0016)));
  T.x=mx-(mx-T.x)*(k2/T.k); T.y=my-(my-T.y)*(k2/T.k); T.k=k2; applyT(false);
},{passive:false});
function zoom(f){ const r=svg.getBoundingClientRect(); const mx=r.width/2,my=r.height/2; const k2=Math.max(.25,Math.min(2.5,T.k*f)); T.x=mx-(mx-T.x)*(k2/T.k); T.y=my-(my-T.y)*(k2/T.k); T.k=k2; applyT(true); }
$('#zin').onclick=()=>zoom(1.25); $('#zout').onclick=()=>zoom(.8); $('#fit').onclick=()=>fit();

/* ---------- drawer ---------- */
const drawer=$('#drawer'), dr=$('#dr');
function prompts(n){
  const cs = (n.c||[]).length ? ` ${U.feeds}: ${n.c.map(c=>c+' - '+D.controls[c]).join(' | ')}` : '';
  const base = `${U.learner} Topic: "${n.t}" in the context of ${U.context}.\nWhat I already read: ${n.s||''}${cs}\n`;
  const o={}; for(const k of PK) o[k]=base+'\n'+U.prompts[k]; return o;
}
function crumb(n){ const a=[]; let p=n.parent; while(p){a.unshift(p);p=p.parent} return a.map(x=>`<a data-id="${x.id}">${esc(x.t)}</a>`).join(' › '); }
function openDrawer(n){
  const lv={foundation:['f','Foundation'],core:['c','Core'],dive:['d','Deep dive']}[n.lv]||['c','Core'];
  const P=prompts(n);
  const srcs=(n.src||[]).map(k=>D.sources[k]).filter(Boolean);
  const st=S.status[n.id]||0;
  dr.innerHTML=`
   <button class="icon-btn close" id="x" title="Close (Esc)">✕</button>
   <div class="crumb">${crumb(n)||'Start here'}</div>
   <h2>${esc(n.t)}</h2>
   <div class="badges">
     <span class="badge ${lv[0]}">${lv[1]}</span>
     ${n.ungrounded?'<span class="badge u">Not verified yet</span>':''}
     ${(n.c||[]).map(c=>`<span class="badge ctl" data-c="${c}" title="${esc(D.controls[c])}">${esc(U.anchor)} ${c}</span>`).join('')}
   </div>
   <div class="callout">${esc(n.s||'')}</div>
   ${n.w?`<div class="sec">${esc(U.why)}</div><p>${esc(n.w)}</p>`:''}
   <div class="sec">Your progress</div>
   <div class="seg" id="seg"><button data-s="0">To learn</button><button data-s="1">Learning</button><button data-s="2">Got it ✓</button></div>
   <div class="sec">Learn it yourself</div>
   <div class="links">${srcs.length?srcs.map(s=>!s.u?`<div class="item" style="margin-bottom:6px;cursor:default"><span>\ud83d\udcd6</span><span>${esc(s.t)}<small>${esc(s.ref)}</small></span></div>`:`<a href="${s.u}" target="_blank" rel="noopener"><span>📖</span><span>${esc(s.t)}<small>${esc(s.u.replace(/^https?:\/\//,'').slice(0,60))}</small></span></a>`).join(''):`<p style="color:var(--muted)">${n.ungrounded?'No opened source yet. Use the AI prompt, then ask the architect to confirm.':'Built from the case documents and your own judgment. Use the AI prompt to go deeper.'}</p>`}</div>
   <div class="sec">Learn with AI</div>
   <div class="ai">
     <div class="tb" id="tb">
       ${PK.map(k=>`<button data-m="${k}">${esc(U.labels[k]||k)}</button>`).join('')}
     </div>
     <textarea id="ta" readonly></textarea>
     <div class="ft"><small style="color:var(--muted)">Paste into any AI chat</small><button class="btn" id="copy">Copy prompt</button></div>
   </div>
   <div class="sec">My notes</div>
   <textarea class="notes" id="notes" placeholder="What clicked, what did not, what to ask the architect...">${esc(S.notes[n.id]||'')}</textarea>
   ${n.kids.length?`<div class="sec">Inside this topic</div><div class="kids">${n.kids.map(k=>`<button data-id="${k.id}">${esc(k.t)}</button>`).join('')}</div>`:''}
   <div class="nav"><button class="btn ghost" id="prev">← Previous</button><button class="btn" id="next">Next topic →</button></div>`;
  const ta=$('#ta'); const setMode=m=>{ S.aiMode=m; ta.value=P[m]; $('#tb').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.m===m)); };
  setMode(S.aiMode);
  $('#tb').onclick=e=>{ if(e.target.dataset.m) setMode(e.target.dataset.m); };
  $('#copy').onclick=async()=>{ try{ await navigator.clipboard.writeText(ta.value);}catch(e){ ta.select(); document.execCommand('copy'); } $('#copy').textContent='Copied ✓'; setTimeout(()=>$('#copy').textContent='Copy prompt',1400); };
  const segs=$('#seg'); segs.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.s===st));
  segs.onclick=e=>{ const s=e.target.dataset.s; if(s===undefined) return; S.status[n.id]=+s; persist(); segs.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.s===s)); renderAll(); };
  $('#notes').oninput=e=>{ S.notes[n.id]=e.target.value; persist(); };
  $('#x').onclick=closeDrawer;
  dr.querySelectorAll('[data-id]').forEach(a=>a.onclick=()=>select(a.dataset.id,true));
  dr.querySelectorAll('[data-c]').forEach(a=>a.onclick=()=>setControl(a.dataset.c));
  const i=order.indexOf(n);
  $('#prev').onclick=()=>select(order[Math.max(0,i-1)].id,true); $('#next').onclick=()=>select(order[Math.min(order.length-1,i+1)].id,true);
  drawer.classList.add('open');
}
function closeDrawer(){ drawer.classList.remove('open'); S.sel=null; renderAll(); }
function select(id,focus){
  const n=N[id]; S.sel=id;
  if(S.view!=='map') setView('map');
  const ch=expandTo(n); if(ch) persist();
  openDrawer(n); renderAll();
  if(focus) setTimeout(()=>focusNode(id),30);
}

/* ---------- views ---------- */
function setView(v){
  S.view=v; document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  $('#pathv').classList.toggle('on',v==='path'); $('#ctlv').classList.toggle('on',v==='controls');
  $('.legend').style.display=$('.tools').style.display=v==='map'?'':'none'; $('#filters').style.display=v==='map'||v==='path'?'':'none';
  if(v==='map'){ setTimeout(()=>{ if(!T._set){fit(false);T._set=1;} },0); }
  renderAll();
}
function renderPath(){
  const v=$('#pathv'); const lit=litSet();
  v.innerHTML=`<h3>Your learning path</h3><p class="lead">Go top to bottom. Foundation topics first inside each branch. Click any topic to open it. Your progress is saved in this browser.</p>`+
  root.kids.map(d=>{ const p=domProgress(d); const k=[]; (function g(x){x.kids.forEach(c=>{k.push(c);g(c)})})(d);
    const items=k.filter(c=>!lit||lit.has(c.id));
    if(lit && !lit.has(d.id)) return '';
    return `<section class="dom"><div class="h" data-id="${d.id}"><div class="num" style="background:hsl(${d.hue} 68% 50%)">${d.num}</div><div style="flex:1"><b>${esc(d.t)}</b><div style="color:var(--muted);font-size:12.5px">${esc(d.s||'')}</div></div><span style="color:var(--muted);font-size:12px">${p.done}/${p.tot}</span><div class="bar"><i style="width:${p.tot?p.done/p.tot*100:0}%;background:hsl(${d.hue} 68% 50%)"></i></div></div>
    <div class="items">${items.map(c=>{const s=S.status[c.id]||0;return `<div class="item" data-id="${c.id}"><span class="dot s${s}">${s===2?'✓':''}</span><div><b>${esc(c.t)}</b><small>${{foundation:'Foundation',core:'Core',dive:'Deep dive'}[c.lv]}${crit(c)?' · '+c.c.join(' ')+' ★':''}</small></div></div>`}).join('')}</div></section>`; }).join('')+
  `<p style="margin-top:24px"><button class="btn ghost" id="reset">Reset my progress</button></p>`;
  v.querySelectorAll('[data-id]').forEach(a=>a.onclick=()=>select(a.dataset.id,true));
  const r=$('#reset'); if(r) r.onclick=()=>{ if(confirm('Clear all progress and notes in this browser?')){ S.status={};S.notes={};persist();renderAll(); } };
}
function renderControls(){
  const v=$('#ctlv');
  v.innerHTML=`<h3>The ${Object.keys(D.controls).length} ${esc(U.anchors.toLowerCase())}</h3><p class="lead">Click one to light up every topic behind it.</p><div class="cgrid">`+
  Object.entries(D.controls).map(([id,t])=>{ const ns=order.filter(n=>(n.c||[]).includes(id)); const done=ns.filter(n=>S.status[n.id]===2).length;
    return `<div class="ccard" data-c="${id}"><b>${id}</b><div>${esc(t)}</div><small>${ns.length} topics · ${done} done</small></div>`; }).join('')+`</div>`;
  v.querySelectorAll('[data-c]').forEach(a=>a.onclick=()=>setControl(a.dataset.c));
}
function setControl(c){
  S.control = S.control===c?null:c;
  if(S.control){ order.forEach(n=>{ if((n.c||[]).includes(c)) expandTo(n); }); persist(); }
  $('#ctlchip').classList.toggle('show',!!S.control); $('#ctlchip').textContent=S.control?`${U.anchor} ${S.control} ✕`:'';
  if(S.view!=='map') setView('map');
  renderAll(); setTimeout(()=>fit(),340);
}
$('#ctlchip').onclick=()=>setControl(S.control);

function renderAll(){ render(); renderPath(); renderControls(); if(S.sel && drawer.classList.contains('open')){ /* keep drawer */ } }

/* ---------- wiring ---------- */
$('#tabs').onclick=e=>{ if(e.target.dataset.v) setView(e.target.dataset.v); };
$('#filters').onclick=e=>{ const f=e.target.closest('[data-f]'); if(!f) return;
  S.filter=f.dataset.f; document.querySelectorAll('#filters [data-f]').forEach(b=>b.classList.toggle('on',b===f));
  if(S.filter!=='all'){ order.forEach(n=>{ if(n.depth>0&&matches(n)) expandTo(n); }); }
  renderAll(); setTimeout(()=>fit(),340); };
$('#q').oninput=e=>{ S.q=e.target.value.trim().toLowerCase(); if(S.q){ order.forEach(n=>{ if(n.depth>0&&matches(n)) expandTo(n); }); } renderAll(); setTimeout(()=>fit(),340); };
$('#expand').onclick=()=>{ S.collapsed.clear(); persist(); render(); setTimeout(()=>fit(),340); };
$('#collapse').onclick=()=>{ order.forEach(n=>{ if(n.depth===1) S.collapsed.add(n.id); }); persist(); render(); setTimeout(()=>fit(),340); };
addEventListener('keydown',e=>{
  if(e.key==='/' && document.activeElement.tagName!=='INPUT' && document.activeElement.tagName!=='TEXTAREA'){ e.preventDefault(); $('#q').focus(); }
  else if(e.key==='Escape'){ if(S.q||document.activeElement===$('#q')){ $('#q').value='';S.q='';$('#q').blur();renderAll(); } else if(drawer.classList.contains('open')) closeDrawer(); }
  else if((e.key==='f'||e.key==='F') && document.activeElement.tagName!=='INPUT' && document.activeElement.tagName!=='TEXTAREA') fit();
});
addEventListener('resize',()=>{});
$('#tabctl').textContent=U.anchors; $('#critlbl').textContent=U.critical; $('#goldlbl').textContent='Gold badge: '+U.anchors.toLowerCase()+' it feeds';
if(!HAS_ANCHORS){ $('#tabctl').style.display='none'; document.querySelector('[data-f=crit]').style.display='none'; }
if(S.aiMode && !U.prompts[S.aiMode]) S.aiMode=PK[0];
render(true); setView('map'); setTimeout(()=>{fit(false);T._set=1;},60);
setTimeout(()=>{ $('#hint').style.opacity=0; },9000);
const h=location.hash.match(/n=(\w+)/); if(h&&N[h[1]]) select(h[1],true);
if(/view=(path|controls)/.test(location.hash)) setView(location.hash.match(/view=(\w+)/)[1]);
})();
</script>
