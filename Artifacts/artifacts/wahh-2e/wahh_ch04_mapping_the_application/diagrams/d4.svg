<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img">
<title>d4: entry points in one request</title>
<desc>Anatomy: a request with its entry points bracketed: URL path, query parameter, headers, cookie, POST fields. JSON keys are drawn grey as not verified.</desc>
<defs><marker id="d4-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink,#1d1f23)"/></marker><marker id="d4-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--danger,#d1453b)"/></marker><marker id="d4-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--accent,#b7791f)"/></marker><marker id="d4-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--muted,#6b6f76)"/></marker><marker id="d4-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--client,#2f6fdb)"/></marker><marker id="d4-server" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--server,#1f9d6b)"/></marker></defs>
<rect x="0" y="0" width="1000" height="540" style="fill:var(--bg,#fbfaf7)"/>
<text x="30" y="28" text-anchor="start" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:16px;font-weight:700;fill:var(--ink,#1d1f23)">d4: entry points in one request</text>
<text x="40" y="80" textLength="35.2" lengthAdjust="spacingAndGlyphs" style="font-family:ui-monospace, SFMono-Regular, Consolas, Menlo, monospace;font-size:15px;fill:var(--ink,#1d1f23)">POST</text>
<text x="84.0" y="80" textLength="299.20000000000005" lengthAdjust="spacingAndGlyphs" style="font-family:ui-monospace, SFMono-Regular, Consolas, Menlo, monospace;font-size:15px;fill:var(--ink,#1d1f23)">/shop/browse/electronics/iPhone3G/</text>
<text x="383.20000000000005" y="80" textLength="140.8" lengthAdjust="spacingAndGlyphs" style="font-family:ui-monospace, SFMono-Regular, Consolas, Menlo, monospace;font-size:15px;fill:var(--ink,#1d1f23)">?FUZZ=test_value</text>
<path d="M84.0,88 L84.0,94 L381.20000000000005,94 L381.20000000000005,88" fill="none" style="stroke:var(--client,#2f6fdb);stroke-width:1.6"/>
<path d="M383.20000000000005,88 L383.20000000000005,94 L524.0,94 L524.0,88" fill="none" style="stroke:var(--client,#2f6fdb);stroke-width:1.6"/>
<text x="387.20000000000005" y="114" text-anchor="start" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">query parameter</text>
<path d="M233.60000000000002,94 L233.60000000000002,130" fill="none" style="stroke:var(--client,#2f6fdb);stroke-width:1.6;stroke-dasharray:none" />
<text x="243.60000000000002" y="134" text-anchor="start" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">URL path: the parts are data, like query values (REST-style)</text>
<text x="40" y="172" textLength="114.4" lengthAdjust="spacingAndGlyphs" style="font-family:ui-monospace, SFMono-Regular, Consolas, Menlo, monospace;font-size:15px;fill:var(--ink,#1d1f23)">Host: $TARGET</text>
<text x="40" y="198" textLength="132.0" lengthAdjust="spacingAndGlyphs" style="font-family:ui-monospace, SFMono-Regular, Consolas, Menlo, monospace;font-size:15px;fill:var(--ink,#1d1f23)">User-Agent: ...</text>
<text x="40" y="224" textLength="105.60000000000001" lengthAdjust="spacingAndGlyphs" style="font-family:ui-monospace, SFMono-Regular, Consolas, Menlo, monospace;font-size:15px;fill:var(--ink,#1d1f23)">Referer: ...</text>
<text x="40" y="250" textLength="176.0" lengthAdjust="spacingAndGlyphs" style="font-family:ui-monospace, SFMono-Regular, Consolas, Menlo, monospace;font-size:15px;fill:var(--ink,#1d1f23)">X-Forwarded-For: ...</text>
<text x="40" y="290" textLength="96.80000000000001" lengthAdjust="spacingAndGlyphs" style="font-family:ui-monospace, SFMono-Regular, Consolas, Menlo, monospace;font-size:15px;fill:var(--ink,#1d1f23)">Cookie: ...</text>
<text x="40" y="340" textLength="114.4" lengthAdjust="spacingAndGlyphs" style="font-family:ui-monospace, SFMono-Regular, Consolas, Menlo, monospace;font-size:15px;fill:var(--muted,#6b6f76)">[POST fields]</text>
<path d="M300,158 h8 v98 h-8" fill="none" style="stroke:var(--client,#2f6fdb);stroke-width:1.6"/>
<text x="320" y="200" text-anchor="start" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">Headers the app may trust:</text>
<text x="320" y="218" text-anchor="start" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">Host, User-Agent, Referer, X-Forwarded-For</text>
<path d="M300,276 h8 v18 h-8" fill="none" style="stroke:var(--client,#2f6fdb);stroke-width:1.6"/>
<text x="320" y="290" text-anchor="start" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">cookie</text>
<path d="M300,326 h8 v20 h-8" fill="none" style="stroke:var(--client,#2f6fdb);stroke-width:1.6"/>
<text x="320" y="341" text-anchor="start" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">POST fields in the body</text>
<rect x="30" y="380" width="420" height="60" rx="6" style="fill:var(--bg,#fbfaf7);stroke:var(--muted,#6b6f76);stroke-width:1.5;stroke-dasharray:6 4"/>
<text x="240.0" y="405.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--muted,#6b6f76)">JSON keys and nested fields</text>
<text x="240.0" y="423.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--muted,#6b6f76)">not verified</text>
<rect x="490" y="380" width="480" height="60" rx="6" style="fill:var(--bg,#fbfaf7);stroke:var(--server,#1f9d6b);stroke-width:1.5;stroke-dasharray:none"/>
<text x="730.0" y="405.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">Out-of-band channels: SMTP mail,</text>
<text x="730.0" y="423.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">a server-side fetch, a mobile API</text>
<g data-when="applies">
<rect x="30" y="460" width="460.0" height="64" rx="6" style="fill:var(--bg,#fbfaf7);stroke:var(--server,#1f9d6b);stroke-width:1.5;stroke-dasharray:none"/>
<text x="260.0" y="487.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;font-weight:700;fill:var(--ink,#1d1f23)">Applies</text>
<text x="260.0" y="505.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">input reaches server logic</text>
</g>
<g data-when="fails">
<rect x="510.0" y="460" width="460.0" height="64" rx="6" style="fill:var(--bg,#fbfaf7);stroke:var(--danger,#d1453b);stroke-width:1.5;stroke-dasharray:6 4"/>
<text x="740.0" y="487.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;font-weight:700;fill:var(--ink,#1d1f23)">Does not apply</text>
<text x="740.0" y="505.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">a client-side-only field</text>
</g>
</svg>
