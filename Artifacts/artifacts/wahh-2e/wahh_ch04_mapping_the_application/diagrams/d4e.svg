<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 445" role="img">
<title>d4e: out-of-band test with interactsh</title>
<desc>Sequence: interactsh-client prints a name; you send it in X-Forwarded-For to the target; the target resolves it at the OAST server; the client prints the DNS interaction.</desc>
<defs><marker id="d4e-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink,#1d1f23)"/></marker><marker id="d4e-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--danger,#d1453b)"/></marker><marker id="d4e-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--accent,#b7791f)"/></marker><marker id="d4e-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--muted,#6b6f76)"/></marker><marker id="d4e-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--client,#2f6fdb)"/></marker><marker id="d4e-server" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--server,#1f9d6b)"/></marker></defs>
<rect x="0" y="0" width="1000" height="445" style="fill:var(--bg,#fbfaf7)"/>
<text x="30" y="28" text-anchor="start" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:16px;font-weight:700;fill:var(--ink,#1d1f23)">d4e: out-of-band test with interactsh</text>
<path d="M150,100 L150,425" fill="none" style="stroke:var(--muted,#6b6f76);stroke-width:1.2;stroke-dasharray:3 5"/>
<rect x="40" y="46" width="220" height="54" rx="6" style="fill:var(--bg,#fbfaf7);stroke:var(--client,#2f6fdb);stroke-width:1.5;stroke-dasharray:none"/>
<text x="150.0" y="68.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;font-weight:700;fill:var(--ink,#1d1f23)">You</text>
<text x="150.0" y="86.0" text-anchor="middle" style="font-family:ui-monospace, SFMono-Regular, Consolas, Menlo, monospace;font-size:13px;fill:var(--ink,#1d1f23)">interactsh-client</text>
<path d="M500,100 L500,425" fill="none" style="stroke:var(--muted,#6b6f76);stroke-width:1.2;stroke-dasharray:3 5"/>
<rect x="390" y="46" width="220" height="54" rx="6" style="fill:var(--bg,#fbfaf7);stroke:var(--server,#1f9d6b);stroke-width:1.5;stroke-dasharray:none"/>
<text x="500.0" y="77.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;font-weight:700;fill:var(--ink,#1d1f23)">$TARGET</text>
<path d="M850,100 L850,425" fill="none" style="stroke:var(--muted,#6b6f76);stroke-width:1.2;stroke-dasharray:3 5"/>
<rect x="720" y="46" width="260" height="54" rx="6" style="fill:var(--bg,#fbfaf7);stroke:var(--ink,#1d1f23);stroke-width:1.5;stroke-dasharray:none"/>
<text x="850.0" y="68.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;font-weight:700;fill:var(--ink,#1d1f23)">OAST server</text>
<text x="850.0" y="86.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">you control it</text>
<g data-step="1">
<rect x="40" y="118" width="220" height="56" rx="6" style="fill:var(--bg,#fbfaf7);stroke:var(--client,#2f6fdb);stroke-width:1.5;stroke-dasharray:none"/>
<text x="150.0" y="141.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">prints a name:</text>
<text x="150.0" y="159.0" text-anchor="middle" style="font-family:ui-monospace, SFMono-Regular, Consolas, Menlo, monospace;font-size:13px;fill:var(--ink,#1d1f23)">c23b2...oast.pro</text>
<circle cx="40" cy="118" r="11" style="fill:var(--bg,#fbfaf7);stroke:var(--ink,#1d1f23);stroke-width:1.5"/><text x="40" y="122.5" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:700;fill:var(--ink,#1d1f23)">1</text>
</g>
<g data-step="2">
<path d="M150,245 L500,245" fill="none" style="stroke:var(--client,#2f6fdb);stroke-width:1.6;stroke-dasharray:none" marker-end="url(#d4e-client)"/>
<circle cx="150" cy="245" r="11" style="fill:var(--bg,#fbfaf7);stroke:var(--ink,#1d1f23);stroke-width:1.5"/><text x="150" y="249.5" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:700;fill:var(--ink,#1d1f23)">2</text>
<text x="325" y="200" text-anchor="middle" style="font-family:ui-monospace, SFMono-Regular, Consolas, Menlo, monospace;font-size:13px;fill:var(--ink,#1d1f23)">curl -s -H "X-Forwarded-For:</text>
<text x="325" y="218" text-anchor="middle" style="font-family:ui-monospace, SFMono-Regular, Consolas, Menlo, monospace;font-size:13px;fill:var(--ink,#1d1f23)">c23b2...oast.pro" $TARGET</text>
</g>
<g data-step="3">
<path d="M500,330 L850,330" fill="none" style="stroke:var(--server,#1f9d6b);stroke-width:1.6;stroke-dasharray:none" marker-end="url(#d4e-server)"/>
<circle cx="500" cy="330" r="11" style="fill:var(--bg,#fbfaf7);stroke:var(--ink,#1d1f23);stroke-width:1.5"/><text x="500" y="334.5" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:700;fill:var(--ink,#1d1f23)">3</text>
<text x="675" y="292" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">DNS lookup of</text>
<text x="675" y="310" text-anchor="middle" style="font-family:ui-monospace, SFMono-Regular, Consolas, Menlo, monospace;font-size:13px;fill:var(--ink,#1d1f23)">c23b2...oast.pro</text>
<text x="675" y="354" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;fill:var(--muted,#6b6f76)">the page shows nothing</text>
</g>
<g data-step="4">
<path d="M850,405 L150,405" fill="none" style="stroke:var(--accent,#b7791f);stroke-width:1.6;stroke-dasharray:6 4" marker-end="url(#d4e-accent)"/>
<circle cx="850" cy="405" r="11" style="fill:var(--bg,#fbfaf7);stroke:var(--ink,#1d1f23);stroke-width:1.5"/><text x="850" y="409.5" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:700;fill:var(--ink,#1d1f23)">4</text>
<text x="500" y="396" text-anchor="middle" style="font-family:ui-monospace, SFMono-Regular, Consolas, Menlo, monospace;font-size:13px;fill:var(--ink,#1d1f23)">Received DNS interaction (A)</text>
</g>
</svg>
