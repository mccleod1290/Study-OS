<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" role="img">
<title>d6: read parameter names like the programmer</title>
<desc>Anatomy: calendar.jsp?isExpired=0&amp;OrderBy=name means Java, a flag to flip and a database ORDER BY. The path /pub/media/117/view maps to manager?schema=pub&amp;id=117&amp;action=view; try edit, add and higher ids.</desc>
<defs><marker id="d6-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink,#1d1f23)"/></marker><marker id="d6-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--danger,#d1453b)"/></marker><marker id="d6-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--accent,#b7791f)"/></marker><marker id="d6-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--muted,#6b6f76)"/></marker><marker id="d6-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--client,#2f6fdb)"/></marker><marker id="d6-server" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--server,#1f9d6b)"/></marker></defs>
<rect x="0" y="0" width="1000" height="590" style="fill:var(--bg,#fbfaf7)"/>
<text x="30" y="28" text-anchor="start" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:16px;font-weight:700;fill:var(--ink,#1d1f23)">d6: read parameter names like the programmer</text>
<text x="30" y="60" text-anchor="start" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;font-weight:700;fill:var(--ink,#1d1f23)">Dissecting a request</text>
<text x="40" y="110" textLength="144" lengthAdjust="spacingAndGlyphs" style="font-family:ui-monospace, SFMono-Regular, Consolas, Menlo, monospace;font-size:20px;fill:var(--ink,#1d1f23)">calendar.jsp</text>
<text x="184" y="110" textLength="12" lengthAdjust="spacingAndGlyphs" style="font-family:ui-monospace, SFMono-Regular, Consolas, Menlo, monospace;font-size:20px;fill:var(--ink,#1d1f23)">?</text>
<text x="196" y="110" textLength="132" lengthAdjust="spacingAndGlyphs" style="font-family:ui-monospace, SFMono-Regular, Consolas, Menlo, monospace;font-size:20px;fill:var(--ink,#1d1f23)">isExpired=0</text>
<text x="328" y="110" textLength="12" lengthAdjust="spacingAndGlyphs" style="font-family:ui-monospace, SFMono-Regular, Consolas, Menlo, monospace;font-size:20px;fill:var(--ink,#1d1f23)">&amp;</text>
<text x="340" y="110" textLength="144" lengthAdjust="spacingAndGlyphs" style="font-family:ui-monospace, SFMono-Regular, Consolas, Menlo, monospace;font-size:20px;fill:var(--ink,#1d1f23)">OrderBy=name</text>
<path d="M40,116 L40,122 L182,122 L182,116" fill="none" style="stroke:var(--client,#2f6fdb);stroke-width:1.6"/>
<path d="M196,116 L196,122 L326,122 L326,116" fill="none" style="stroke:var(--client,#2f6fdb);stroke-width:1.6"/>
