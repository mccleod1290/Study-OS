<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img">
<title>d5: fingerprint signals to a stack to known flaws</title>
<desc>Flow: four signals (banner, HTTP fingerprint, extension and error page, cookie and directory names) name the stack; then component and version go to OSV.dev. An empty answer means no known entry, not no flaw. Grey boxes are not verified.</desc>
<defs><marker id="d5-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink,#1d1f23)"/></marker><marker id="d5-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--danger,#d1453b)"/></marker><marker id="d5-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--accent,#b7791f)"/></marker><marker id="d5-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--muted,#6b6f76)"/></marker><marker id="d5-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--client,#2f6fdb)"/></marker><marker id="d5-server" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--server,#1f9d6b)"/></marker></defs>
<rect x="0" y="0" width="1000" height="520" style="fill:var(--bg,#fbfaf7)"/>
<text x="30" y="28" text-anchor="start" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:16px;font-weight:700;fill:var(--ink,#1d1f23)">d5: fingerprint signals to a stack to known flaws</text>
<g data-step="1">
<rect x="30" y="70" width="470" height="76" rx="6" style="fill:var(--bg,#fbfaf7);stroke:var(--client,#2f6fdb);stroke-width:1.5;stroke-dasharray:none"/>
<text x="265.0" y="94.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">Banner: curl -sI $TARGET</text>
<text x="265.0" y="112.0" text-anchor="middle" style="font-family:ui-monospace, SFMono-Regular, Consolas, Menlo, monospace;font-size:13px;fill:var(--ink,#1d1f23)">httpx -l hosts.txt -sc -title -td -rl 50</text>
<text x="265.0" y="130.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">Server: Apache/1.3.31 names stack and version</text>
<circle cx="30" cy="70" r="11" style="fill:var(--bg,#fbfaf7);stroke:var(--ink,#1d1f23);stroke-width:1.5"/><text x="30" y="74.5" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:700;fill:var(--ink,#1d1f23)">1</text>
<path d="M500,108 L545,108" fill="none" style="stroke:var(--client,#2f6fdb);stroke-width:1.6;stroke-dasharray:none"/>
</g>
<g data-step="2">
<rect x="30" y="158" width="470" height="76" rx="6" style="fill:var(--bg,#fbfaf7);stroke:var(--muted,#6b6f76);stroke-width:1.5;stroke-dasharray:6 4"/>
<text x="265.0" y="182.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--muted,#6b6f76)">HTTP fingerprint: httprecon, httprint</text>
<text x="265.0" y="200.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--muted,#6b6f76)">status not verified</text>
<text x="265.0" y="218.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--muted,#6b6f76)">httpx -td uses the Wappalyzer dataset</text>
<circle cx="30" cy="158" r="11" style="fill:var(--bg,#fbfaf7);stroke:var(--ink,#1d1f23);stroke-width:1.5"/><text x="30" y="162.5" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:700;fill:var(--ink,#1d1f23)">2</text>
<path d="M500,196 L545,196" fill="none" style="stroke:var(--muted,#6b6f76);stroke-width:1.6;stroke-dasharray:none"/>
</g>
<g data-step="3">
<rect x="30" y="246" width="470" height="76" rx="6" style="fill:var(--bg,#fbfaf7);stroke:var(--client,#2f6fdb);stroke-width:1.5;stroke-dasharray:none"/>
<text x="265.0" y="270.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">Extension and error page</text>
<text x="265.0" y="288.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">.asp .aspx .jsp .php .dll</text>
<text x="265.0" y="306.0" text-anchor="middle" style="font-family:ui-monospace, SFMono-Regular, Consolas, Menlo, monospace;font-size:13px;fill:var(--ink,#1d1f23)">curl -sI $TARGET/CookieAuth.dll</text>
<circle cx="30" cy="246" r="11" style="fill:var(--bg,#fbfaf7);stroke:var(--ink,#1d1f23);stroke-width:1.5"/><text x="30" y="250.5" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:700;fill:var(--ink,#1d1f23)">3</text>
<path d="M500,284 L545,284" fill="none" style="stroke:var(--client,#2f6fdb);stroke-width:1.6;stroke-dasharray:none"/>
</g>
<g data-step="4">
<rect x="30" y="334" width="470" height="76" rx="6" style="fill:var(--bg,#fbfaf7);stroke:var(--muted,#6b6f76);stroke-width:1.5;stroke-dasharray:6 4"/>
<text x="265.0" y="358.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--muted,#6b6f76)">Cookie and directory names</text>
<text x="265.0" y="376.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--muted,#6b6f76)">JSESSIONID, ASPSESSIONID, PHPSESSID, /servlet</text>
<text x="265.0" y="394.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--muted,#6b6f76)">not verified</text>
<circle cx="30" cy="334" r="11" style="fill:var(--bg,#fbfaf7);stroke:var(--ink,#1d1f23);stroke-width:1.5"/><text x="30" y="338.5" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:700;fill:var(--ink,#1d1f23)">4</text>
<path d="M500,372 L545,372" fill="none" style="stroke:var(--muted,#6b6f76);stroke-width:1.6;stroke-dasharray:none"/>
</g>
<g data-step="5">
<path d="M545,372 L545,108 L590,108" fill="none" style="stroke:var(--ink,#1d1f23);stroke-width:1.6;stroke-dasharray:none" marker-end="url(#d5-ink)"/>
<rect x="590" y="70" width="380" height="76" rx="6" style="fill:var(--bg,#fbfaf7);stroke:var(--server,#1f9d6b);stroke-width:1.5;stroke-dasharray:none"/>
<text x="780.0" y="94.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">Stack named</text>
<text x="780.0" y="112.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">Apache-Coyote: Tomcat, a Java</text>
<text x="780.0" y="130.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">servlet container</text>
<circle cx="590" cy="70" r="11" style="fill:var(--bg,#fbfaf7);stroke:var(--ink,#1d1f23);stroke-width:1.5"/><text x="590" y="74.5" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:700;fill:var(--ink,#1d1f23)">5</text>
</g>
<g data-step="6">
<path d="M780,146 L780,175" fill="none" style="stroke:var(--server,#1f9d6b);stroke-width:1.6;stroke-dasharray:none" marker-end="url(#d5-server)"/>
<rect x="590" y="175" width="380" height="60" rx="6" style="fill:var(--bg,#fbfaf7);stroke:var(--server,#1f9d6b);stroke-width:1.5;stroke-dasharray:none"/>
<text x="780.0" y="200.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">Third-party component and version</text>
<text x="780.0" y="218.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">research known flaws</text>
<circle cx="590" cy="175" r="11" style="fill:var(--bg,#fbfaf7);stroke:var(--ink,#1d1f23);stroke-width:1.5"/><text x="590" y="179.5" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:700;fill:var(--ink,#1d1f23)">6</text>
</g>
<g data-step="7">
<path d="M780,235 L780,262" fill="none" style="stroke:var(--server,#1f9d6b);stroke-width:1.6;stroke-dasharray:none" marker-end="url(#d5-server)"/>
<rect x="590" y="262" width="380" height="66" rx="6" style="fill:var(--bg,#fbfaf7);stroke:var(--server,#1f9d6b);stroke-width:1.5;stroke-dasharray:none"/>
<text x="780.0" y="290.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">OSV.dev: package, ecosystem, version</text>
<text x="780.0" y="308.0" text-anchor="middle" style="font-family:ui-monospace, SFMono-Regular, Consolas, Menlo, monospace;font-size:13px;fill:var(--ink,#1d1f23)">https://api.osv.dev/v1/query</text>
<circle cx="590" cy="262" r="11" style="fill:var(--bg,#fbfaf7);stroke:var(--ink,#1d1f23);stroke-width:1.5"/><text x="590" y="266.5" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:700;fill:var(--ink,#1d1f23)">7</text>
<path d="M780,328 L780,350" fill="none" style="stroke:var(--danger,#d1453b);stroke-width:1.6;stroke-dasharray:6 4" marker-end="url(#d5-danger)"/>
<rect x="590" y="350" width="380" height="60" rx="6" style="fill:var(--bg,#fbfaf7);stroke:var(--danger,#d1453b);stroke-width:1.5;stroke-dasharray:6 4"/>
<text x="780.0" y="375.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">An empty answer means no known entry,</text>
<text x="780.0" y="393.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">not no flaw</text>
</g>
<g data-when="applies">
<rect x="30" y="435" width="460.0" height="70" rx="6" style="fill:var(--bg,#fbfaf7);stroke:var(--server,#1f9d6b);stroke-width:1.5;stroke-dasharray:none"/>
<text x="260.0" y="465.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;font-weight:700;fill:var(--ink,#1d1f23)">Applies</text>
<text x="260.0" y="483.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">at least one signal is not stripped</text>
</g>
<g data-when="fails">
<rect x="510.0" y="435" width="460.0" height="70" rx="6" style="fill:var(--bg,#fbfaf7);stroke:var(--muted,#6b6f76);stroke-width:1.5;stroke-dasharray:6 4"/>
<text x="740.0" y="456.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;font-weight:700;fill:var(--muted,#6b6f76)">Does not apply</text>
<text x="740.0" y="474.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--muted,#6b6f76)">a CDN normalizes them</text>
<text x="740.0" y="492.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--muted,#6b6f76)">not verified</text>
</g>
</svg>
