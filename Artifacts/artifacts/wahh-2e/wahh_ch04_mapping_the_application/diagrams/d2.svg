<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" role="img">
<title>d2: hidden content discovery loop</title>
<desc>Flow: wordlist, request each name, read status code and size, infer more names, add archives. A 200 with the custom not-found size means absent.</desc>
<defs><marker id="d2-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink,#1d1f23)"/></marker><marker id="d2-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--danger,#d1453b)"/></marker><marker id="d2-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--accent,#b7791f)"/></marker><marker id="d2-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--muted,#6b6f76)"/></marker><marker id="d2-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--client,#2f6fdb)"/></marker><marker id="d2-server" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--server,#1f9d6b)"/></marker></defs>
<rect x="0" y="0" width="1000" height="610" style="fill:var(--bg,#fbfaf7)"/>
<text x="30" y="28" text-anchor="start" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:16px;font-weight:700;fill:var(--ink,#1d1f23)">d2: hidden content discovery loop</text>
<g data-step="1">
<rect x="30" y="90" width="170" height="80" rx="6" style="fill:var(--bg,#fbfaf7);stroke:var(--client,#2f6fdb);stroke-width:1.5;stroke-dasharray:none"/>
<text x="115.0" y="125.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">Wordlist</text>
<text x="115.0" y="143.0" text-anchor="middle" style="font-family:ui-monospace, SFMono-Regular, Consolas, Menlo, monospace;font-size:13px;fill:var(--ink,#1d1f23)">words.txt</text>
<circle cx="30" cy="90" r="11" style="fill:var(--bg,#fbfaf7);stroke:var(--ink,#1d1f23);stroke-width:1.5"/><text x="30" y="94.5" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:700;fill:var(--ink,#1d1f23)">1</text>
</g>
<g data-step="2">
<path d="M200,135 L240,135" fill="none" style="stroke:var(--ink,#1d1f23);stroke-width:1.6;stroke-dasharray:none" marker-end="url(#d2-ink)"/>
<rect x="240" y="90" width="420" height="90" rx="6" style="fill:var(--bg,#fbfaf7);stroke:var(--ink,#1d1f23);stroke-width:1.5;stroke-dasharray:none"/>
<text x="450.0" y="121.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">Request each name</text>
<text x="450.0" y="139.0" text-anchor="middle" style="font-family:ui-monospace, SFMono-Regular, Consolas, Menlo, monospace;font-size:13px;fill:var(--ink,#1d1f23)">ffuf -w words.txt -u $TARGET/FUZZ -ac -rate 20</text>
<text x="450.0" y="157.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">-ac calibrates the fake-404 filter</text>
<circle cx="240" cy="90" r="11" style="fill:var(--bg,#fbfaf7);stroke:var(--ink,#1d1f23);stroke-width:1.5"/><text x="240" y="94.5" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:700;fill:var(--ink,#1d1f23)">2</text>
</g>
<g data-step="3">
<path d="M660,135 L700,135" fill="none" style="stroke:var(--ink,#1d1f23);stroke-width:1.6;stroke-dasharray:none" marker-end="url(#d2-ink)"/>
<rect x="700" y="90" width="270" height="90" rx="6" style="fill:var(--bg,#fbfaf7);stroke:var(--accent,#b7791f);stroke-width:2;stroke-dasharray:none"/>
<text x="835.0" y="121.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">Read status code and size</text>
<text x="835.0" y="139.0" text-anchor="middle" style="font-family:ui-monospace, SFMono-Regular, Consolas, Menlo, monospace;font-size:13px;fill:var(--ink,#1d1f23)">%{http_code} %{size_download}</text>
<text x="835.0" y="157.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">a 200 can be a custom 404</text>
<circle cx="700" cy="90" r="11" style="fill:var(--bg,#fbfaf7);stroke:var(--ink,#1d1f23);stroke-width:1.5"/><text x="700" y="94.5" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:700;fill:var(--ink,#1d1f23)">3</text>
<path d="M780,180 L780,205 L630,205 L630,240" fill="none" style="stroke:var(--danger,#d1453b);stroke-width:1.6;stroke-dasharray:6 4" marker-end="url(#d2-danger)"/>
<path d="M900,180 L900,240" fill="none" style="stroke:var(--server,#1f9d6b);stroke-width:1.6;stroke-dasharray:none" marker-end="url(#d2-server)"/>
<rect x="520" y="240" width="220" height="90" rx="6" style="fill:var(--bg,#fbfaf7);stroke:var(--danger,#d1453b);stroke-width:1.5;stroke-dasharray:6 4"/>
<text x="630.0" y="262.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">Absent</text>
<text x="630.0" y="280.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">200, size equals the</text>
<text x="630.0" y="298.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">custom not-found page</text>
<text x="630.0" y="316.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">filter it: -ac or -fs</text>
<rect x="780" y="240" width="190" height="90" rx="6" style="fill:var(--bg,#fbfaf7);stroke:var(--server,#1f9d6b);stroke-width:1.5;stroke-dasharray:none"/>
<text x="875.0" y="271.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">Exists</text>
<text x="875.0" y="289.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">401 or 403:</text>
<text x="875.0" y="307.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">closed but present</text>
</g>
<g data-step="4">
<path d="M875,330 L875,450 L660,450" fill="none" style="stroke:var(--server,#1f9d6b);stroke-width:1.6;stroke-dasharray:none" marker-end="url(#d2-server)"/>
<rect x="330" y="400" width="330" height="100" rx="6" style="fill:var(--bg,#fbfaf7);stroke:var(--ink,#1d1f23);stroke-width:1.5;stroke-dasharray:none"/>
<text x="495.0" y="427.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">Infer more names</text>
<text x="495.0" y="445.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">AddDocument implies EditDocument</text>
<text x="495.0" y="463.0" text-anchor="middle" style="font-family:ui-monospace, SFMono-Regular, Consolas, Menlo, monospace;font-size:13px;fill:var(--ink,#1d1f23)">-e .bak,.old,.tmp</text>
<text x="495.0" y="481.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">numbers, dates, backups</text>
<circle cx="330" cy="400" r="11" style="fill:var(--bg,#fbfaf7);stroke:var(--ink,#1d1f23);stroke-width:1.5"/><text x="330" y="404.5" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:700;fill:var(--ink,#1d1f23)">4</text>
<path d="M330,450 L60,450 L60,170" fill="none" style="stroke:var(--accent,#b7791f);stroke-width:1.6;stroke-dasharray:none" marker-end="url(#d2-accent)"/>
<text x="72" y="440" text-anchor="start" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">back into the wordlist</text>
</g>
<g data-step="5">
<rect x="100" y="240" width="360" height="100" rx="6" style="fill:var(--bg,#fbfaf7);stroke:var(--ink,#1d1f23);stroke-width:1.5;stroke-dasharray:none"/>
<text x="280.0" y="267.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">Archives and URL history</text>
<text x="280.0" y="285.0" text-anchor="middle" style="font-family:ui-monospace, SFMono-Regular, Consolas, Menlo, monospace;font-size:13px;fill:var(--ink,#1d1f23)">gau --subs $TARGET_DOMAIN</text>
<text x="280.0" y="303.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">path archived, 404 live:</text>
<text x="280.0" y="321.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">a route the app once served</text>
<circle cx="100" cy="240" r="11" style="fill:var(--bg,#fbfaf7);stroke:var(--ink,#1d1f23);stroke-width:1.5"/><text x="100" y="244.5" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:700;fill:var(--ink,#1d1f23)">5</text>
<path d="M150,240 L150,170" fill="none" style="stroke:var(--ink,#1d1f23);stroke-width:1.6;stroke-dasharray:none" marker-end="url(#d2-ink)"/>
</g>
<g data-when="applies">
<rect x="30" y="525" width="460.0" height="70" rx="6" style="fill:var(--bg,#fbfaf7);stroke:var(--server,#1f9d6b);stroke-width:1.5;stroke-dasharray:none"/>
<text x="260.0" y="555.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;font-weight:700;fill:var(--ink,#1d1f23)">Applies</text>
<text x="260.0" y="573.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">unlinked paths exist</text>
</g>
<g data-when="fails">
<rect x="510.0" y="525" width="460.0" height="70" rx="6" style="fill:var(--bg,#fbfaf7);stroke:var(--danger,#d1453b);stroke-width:1.5;stroke-dasharray:6 4"/>
<text x="740.0" y="546.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;font-weight:700;fill:var(--ink,#1d1f23)">Does not apply</text>
<text x="740.0" y="564.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">one URL picks its function by parameter</text>
<text x="740.0" y="582.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">(section 3)</text>
</g>
</svg>
