<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 495" role="img">
<title>d7: map first, probe later</title>
<desc>Flow: content map, functional map, core functions and mechanisms, feature to bug class (grey, not verified), check third-party code, plan of attack, then attack only after the map is done.</desc>
<defs><marker id="d7-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink,#1d1f23)"/></marker><marker id="d7-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--danger,#d1453b)"/></marker><marker id="d7-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--accent,#b7791f)"/></marker><marker id="d7-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--muted,#6b6f76)"/></marker><marker id="d7-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--client,#2f6fdb)"/></marker><marker id="d7-server" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--server,#1f9d6b)"/></marker></defs>
<rect x="0" y="0" width="1000" height="495" style="fill:var(--bg,#fbfaf7)"/>
<text x="30" y="28" text-anchor="start" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:16px;font-weight:700;fill:var(--ink,#1d1f23)">d7: map first, probe later</text>
<g data-step="1">
<rect x="30" y="70" width="300" height="100" rx="6" style="fill:var(--bg,#fbfaf7);stroke:var(--client,#2f6fdb);stroke-width:1.5;stroke-dasharray:none"/>
<text x="180.0" y="124.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">Content map</text>
<circle cx="30" cy="70" r="11" style="fill:var(--bg,#fbfaf7);stroke:var(--ink,#1d1f23);stroke-width:1.5"/><text x="30" y="74.5" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:700;fill:var(--ink,#1d1f23)">1</text>
</g>
<g data-step="2">
<path d="M330,120 L350,120" fill="none" style="stroke:var(--ink,#1d1f23);stroke-width:1.6;stroke-dasharray:none" marker-end="url(#d7-ink)"/>
<rect x="350" y="70" width="300" height="100" rx="6" style="fill:var(--bg,#fbfaf7);stroke:var(--client,#2f6fdb);stroke-width:1.5;stroke-dasharray:none"/>
<text x="500.0" y="124.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">Functional map</text>
<circle cx="350" cy="70" r="11" style="fill:var(--bg,#fbfaf7);stroke:var(--ink,#1d1f23);stroke-width:1.5"/><text x="350" y="74.5" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:700;fill:var(--ink,#1d1f23)">2</text>
</g>
<g data-step="3">
<path d="M650,120 L670,120" fill="none" style="stroke:var(--ink,#1d1f23);stroke-width:1.6;stroke-dasharray:none" marker-end="url(#d7-ink)"/>
<rect x="670" y="70" width="300" height="100" rx="6" style="fill:var(--bg,#fbfaf7);stroke:var(--ink,#1d1f23);stroke-width:1.5;stroke-dasharray:none"/>
<text x="820.0" y="106.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">Core functions and mechanisms</text>
<text x="820.0" y="124.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">session state, access control,</text>
<text x="820.0" y="142.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">authentication, recovery</text>
<circle cx="670" cy="70" r="11" style="fill:var(--bg,#fbfaf7);stroke:var(--ink,#1d1f23);stroke-width:1.5"/><text x="670" y="74.5" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:700;fill:var(--ink,#1d1f23)">3</text>
</g>
<g data-step="4">
<path d="M820.0,170 L820.0,215" fill="none" style="stroke:var(--ink,#1d1f23);stroke-width:1.6;stroke-dasharray:none" marker-end="url(#d7-ink)"/>
<rect x="670" y="215" width="300" height="130" rx="6" style="fill:var(--bg,#fbfaf7);stroke:var(--muted,#6b6f76);stroke-width:1.5;stroke-dasharray:6 4"/>
<text x="820.0" y="239.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--muted,#6b6f76)">Feature to bug class</text>
<text x="820.0" y="257.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--muted,#6b6f76)">upload: path traversal</text>
<text x="820.0" y="275.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--muted,#6b6f76)">login: enumeration</text>
<text x="820.0" y="293.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--muted,#6b6f76)">redirect: open redirect</text>
<text x="820.0" y="311.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--muted,#6b6f76)">email: injection</text>
<text x="820.0" y="329.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--muted,#6b6f76)">not verified</text>
<circle cx="670" cy="215" r="11" style="fill:var(--bg,#fbfaf7);stroke:var(--ink,#1d1f23);stroke-width:1.5"/><text x="670" y="219.5" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:700;fill:var(--ink,#1d1f23)">4</text>
</g>
<g data-step="5">
<path d="M670,280 L650,280" fill="none" style="stroke:var(--ink,#1d1f23);stroke-width:1.6;stroke-dasharray:none" marker-end="url(#d7-ink)"/>
<rect x="350" y="215" width="300" height="130" rx="6" style="fill:var(--bg,#fbfaf7);stroke:var(--ink,#1d1f23);stroke-width:1.5;stroke-dasharray:none"/>
<text x="500.0" y="266.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">Check third-party code</text>
<text x="500.0" y="284.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">OSV.dev</text>
<text x="500.0" y="302.0" text-anchor="middle" style="font-family:ui-monospace, SFMono-Regular, Consolas, Menlo, monospace;font-size:13px;fill:var(--ink,#1d1f23)">nuclei -as</text>
<circle cx="350" cy="215" r="11" style="fill:var(--bg,#fbfaf7);stroke:var(--ink,#1d1f23);stroke-width:1.5"/><text x="350" y="219.5" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:700;fill:var(--ink,#1d1f23)">5</text>
</g>
<g data-step="6">
<path d="M350,280 L330,280" fill="none" style="stroke:var(--ink,#1d1f23);stroke-width:1.6;stroke-dasharray:none" marker-end="url(#d7-ink)"/>
<rect x="30" y="215" width="300" height="130" rx="6" style="fill:var(--bg,#fbfaf7);stroke:var(--accent,#b7791f);stroke-width:2;stroke-dasharray:none"/>
<text x="180.0" y="248.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">Plan of attack</text>
<text x="180.0" y="266.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">rank functions and bug classes</text>
<text x="180.0" y="284.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">first probe all hosts:</text>
<text x="180.0" y="302.0" text-anchor="middle" style="font-family:ui-monospace, SFMono-Regular, Consolas, Menlo, monospace;font-size:13px;fill:var(--ink,#1d1f23)">httpx -l hosts.txt -sc</text>
<text x="180.0" y="320.0" text-anchor="middle" style="font-family:ui-monospace, SFMono-Regular, Consolas, Menlo, monospace;font-size:13px;fill:var(--ink,#1d1f23)">-title -td -rl 50</text>
<circle cx="30" cy="215" r="11" style="fill:var(--bg,#fbfaf7);stroke:var(--ink,#1d1f23);stroke-width:1.5"/><text x="30" y="219.5" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:700;fill:var(--ink,#1d1f23)">6</text>
</g>
<path d="M180,345 L180,400" fill="none" style="stroke:var(--danger,#d1453b);stroke-width:1.6;stroke-dasharray:6 4" marker-end="url(#d7-danger)"/>
<text x="190" y="378" text-anchor="start" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">mapping ends, then attack</text>
<rect x="30" y="400" width="300" height="50" rx="6" style="fill:var(--bg,#fbfaf7);stroke:var(--danger,#d1453b);stroke-width:1.5;stroke-dasharray:6 4"/>
<text x="180.0" y="429.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">Attack, only after the map</text>
<g data-when="applies">
<rect x="350" y="400" width="300" height="70" rx="6" style="fill:var(--bg,#fbfaf7);stroke:var(--server,#1f9d6b);stroke-width:1.5;stroke-dasharray:none"/>
<text x="500.0" y="430.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;font-weight:700;fill:var(--ink,#1d1f23)">Applies</text>
<text x="500.0" y="448.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">mapping ends before probing</text>
</g>
<g data-when="fails">
<rect x="670" y="400" width="300" height="70" rx="6" style="fill:var(--bg,#fbfaf7);stroke:var(--danger,#d1453b);stroke-width:1.5;stroke-dasharray:6 4"/>
<text x="820.0" y="421.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;font-weight:700;fill:var(--ink,#1d1f23)">Does not apply</text>
<text x="820.0" y="439.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">never: no tool maps an app</text>
<text x="820.0" y="457.0" text-anchor="middle" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;fill:var(--ink,#1d1f23)">safely alone</text>
</g>
</svg>
